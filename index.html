<!DOCTYPE html>
<html>
<head>
  <title>Ramadan Pen</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      background: #050301;
      overflow: hidden;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>

<body>

  <video id="vid"></video>
  <canvas id="c"></canvas>

  <script>

    // =========================
    // BASIC SETUP
    // =========================

    var vid = document.getElementById('vid');
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');

    var arr = [];
    var cur = [];

    var shift = false;
    var draw = false;

    var sx = null;
    var sy = null;


    // =========================
    // CANVAS SIZE
    // =========================

    function resizeCanvas() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener('resize', resizeCanvas);


    // =========================
    // KEYBOARD CONTROLS
    // =========================

    window.onkeydown = function(e) {

      // Hold Shift to draw
      if (e.key === 'Shift') {
        shift = true;
      }

      // Space = Clear everything
      if (e.code === 'Space') {

        arr = [];
        cur = [];
        draw = false;

        e.preventDefault();
      }
    };


    window.onkeyup = function(e) {

      // Release Shift = stop drawing
      if (e.key === 'Shift') {
        shift = false;
        draw = false;
      }
    };


    // =========================
    // MEDIAPIPE RESULTS
    // =========================

    function run(res) {

      // Draw camera image
      ctx.drawImage(
        res.image,
        0,
        0,
        c.width,
        c.height
      );


      // Dark Ramadan-style overlay
      ctx.fillStyle = 'rgba(10, 6, 2, 0.85)';
      ctx.fillRect(
        0,
        0,
        c.width,
        c.height
      );


      // =========================
      // DRAW SAVED LINES
      // =========================

      ctx.shadowColor = '#F5D061';
      ctx.shadowBlur = 15;

      ctx.strokeStyle = '#F5D061';
      ctx.lineWidth = 6;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';


      for (var i = 0; i < arr.length; i++) {

        if (arr[i].length === 0) {
          continue;
        }

        ctx.beginPath();

        for (var j = 0; j < arr[i].length; j++) {

          if (j === 0) {

            ctx.moveTo(
              arr[i][j].x,
              arr[i][j].y
            );

          } else {

            ctx.lineTo(
              arr[i][j].x,
              arr[i][j].y
            );

          }
        }

        ctx.stroke();
      }


      // =========================
      // HAND DETECTION
      // =========================

      if (
        res.multiHandLandmarks &&
        res.multiHandLandmarks.length > 0
      ) {

        var lm = res.multiHandLandmarks[0];


        // Draw hand skeleton
        drawConnectors(
          ctx,
          lm,
          HAND_CONNECTIONS,
          {
            color: 'rgba(245, 208, 97, 0.3)',
            lineWidth: 2
          }
        );


        // Draw hand landmarks
        drawLandmarks(
          ctx,
          lm,
          {
            color: '#FFFFFF',
            lineWidth: 1,
            radius: 2
          }
        );


        // =========================
        // INDEX FINGER
        // =========================

        var ind = lm[8];

        var rx = ind.x * c.width;
        var ry = ind.y * c.height;


        // Smooth movement
        if (sx === null) {

          sx = rx;
          sy = ry;

        } else {

          sx += (rx - sx) * 0.45;
          sy += (ry - sy) * 0.45;

        }


        // =========================
        // PEN CURSOR
        // =========================

        ctx.beginPath();

        ctx.arc(
          sx,
          sy,
          6,
          0,
          2 * Math.PI
        );


        if (shift) {

          // White cursor while drawing
          ctx.fillStyle = '#FFFFFF';

        } else {

          // Golden cursor normally
          ctx.fillStyle = 'rgba(245, 208, 97, 0.4)';

        }

        ctx.fill();


        // =========================
        // DRAWING
        // =========================

        if (shift) {

          // Start a new line
          if (!draw) {

            draw = true;

            cur = [];

            arr.push(cur);
          }


          // Add current finger position
          cur.push({
            x: sx,
            y: sy
          });

        } else {

          draw = false;
        }


      } else {

        // No hand detected
        draw = false;

        sx = null;
        sy = null;
      }
    }


    // =========================
    // MEDIAPIPE HANDS
    // =========================

    var h = new Hands({

      locateFile: function(file) {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

      }

    });


    h.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.5,

      minTrackingConfidence: 0.5

    });


    h.onResults(run);


    // =========================
    // CAMERA
    // =========================

    var cam = new Camera(vid, {

      onFrame: async function() {

        await h.send({
          image: vid
        });

      },

      width: 1280,
      height: 720

    });


    cam.start();

  </script>

</body>
</html>
